<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#C1272D">
  <title>Market Bouaké</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="accueil">

<div id="site-header"></div>

<main>
  <section class="hero">
    <div class="container">
      <h1>La plateforme locale de Bouaké</h1>
      <p>Achetez, vendez, trouvez un logement ou une offre d'emploi, près de chez vous.</p>
      <div class="cta" id="cta">
        <a class="btn" href="auth.html">Créer un compte</a>
        <a class="btn sec" href="auth.html">Se connecter</a>
      </div>
    </div>
  </section>

  <div class="container" id="sections">
    <section class="section" id="cat-section">
      <div class="sec-head"><h2>Catégories</h2><a href="#" data-soon="Marketplace">Voir plus</a></div>
      <div class="cat-chips" id="cats"></div>
    </section>
  </div>
  <div class="pagebottom"></div>
</main>

<div id="site-footer"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script src="js/supabase-client.js"></script>
<script src="js/layout.js"></script>
<script>
(function () {
  var SECTIONS = [
    ["Produits populaires", "Marketplace", "Aucun produit pour le moment", "Les produits des vendeurs apparaîtront ici."],
    ["Produits récemment publiés", "Marketplace", "Aucun produit pour le moment", "Les nouveautés apparaîtront ici."],
    ["Boutiques à découvrir", "Boutiques", "Aucune boutique pour le moment", "Les boutiques des vendeurs apparaîtront ici."],
    ["Publicités et promotions", "Publicités", "Aucune publicité en cours", "Les promotions et annonces apparaîtront ici."],
    ["Événements à venir", "Événements", "Aucun événement à venir", "Concerts, conférences et cérémonies apparaîtront ici."],
    ["Offres d'emploi récentes", "Offres d'emploi", "Aucune offre d'emploi pour le moment", "Les offres publiées par l'administration apparaîtront ici."],
    ["Offres de stage récentes", "Offres de stage", "Aucune offre de stage pour le moment", "Les stages apparaîtront ici."],
    ["Résidences disponibles", "Résidences", "Aucune résidence pour le moment", "Maisons à louer, appartements et studios apparaîtront ici."],
    ["Hôtels à découvrir", "Hôtels", "Aucun hôtel pour le moment", "Hôtels et auberges apparaîtront ici."]
  ];

  var box = document.getElementById("sections");
  SECTIONS.forEach(function (s) {
    var sec = document.createElement("section");
    sec.className = "section";
    var head = document.createElement("div");
    head.className = "sec-head";
    var h2 = document.createElement("h2");
    h2.textContent = s[0];
    var more = document.createElement("a");
    more.href = "#";
    more.setAttribute("data-soon", s[1]);
    more.textContent = "Voir plus";
    head.append(h2, more);
    var empty = document.createElement("div");
    empty.className = "empty";
    var st = document.createElement("strong");
    st.textContent = s[2];
    var sp = document.createElement("span");
    sp.textContent = s[3];
    empty.append(st, sp);
    sec.append(head, empty);
    box.appendChild(sec);
  });

  (async function () {
    var cats = document.getElementById("cats");
    try {
      var res = await sb.from("categories").select("id,name,sort_order")
        .eq("is_active", true).order("sort_order");
      if (res.error) throw res.error;
      if (!res.data || !res.data.length) {
        cats.className = "empty";
        cats.innerHTML = "<strong>Aucune catégorie pour le moment</strong>";
        return;
      }
      res.data.forEach(function (c) {
        var a = document.createElement("a");
        a.href = "#";
        a.setAttribute("data-soon", c.name);
        a.textContent = c.name;
        cats.appendChild(a);
      });
    } catch (e) {
      console.error(e);
      cats.className = "empty";
      cats.innerHTML = "<strong>Les catégories ne peuvent pas être chargées</strong><span>Réessayez dans un instant.</span>";
    }
  })();

  window.MB_SESSION.then(function (session) {
    if (!session) return;
    var cta = document.getElementById("cta");
    cta.textContent = "";
    var b = document.createElement("a");
    b.className = "btn";
    b.href = "account.html";
    b.textContent = "Accéder à mon compte";
    cta.appendChild(b);
  });
})();
</script>
</body>
</html>
